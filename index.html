<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BTS x BLACKPINK Memory Game V2</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Segoe UI,Arial,sans-serif;min-height:100vh;text-align:center;color:white;background:radial-gradient(circle at top,#ff69b4,#8a2be2,#111)}h1{padding:15px;text-shadow:0 0 15px white}.topbar{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:10px}.info,select,button{background:rgba(255,255,255,.15);color:white;border:none;padding:10px 14px;border-radius:20px}button{cursor:pointer;font-weight:bold}#game{width:min(95vw,960px);margin:auto;display:grid;grid-template-columns:repeat(4,minmax(70px,1fr));gap:10px;padding:20px}.card{aspect-ratio:1;perspective:1000px;cursor:pointer}.card-inner{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}.card.flipped .card-inner,.card.matched .card-inner{transform:rotateY(180deg)}.front,.back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:12px;overflow:hidden}.front{display:flex;align-items:center;justify-content:center;font-size:2rem;background:linear-gradient(45deg,#ff1493,#8a2be2);box-shadow:0 0 15px #ff69b4,0 0 25px #8a2be2}.back{transform:rotateY(180deg);background:#fff}.back img{width:100%;height:100%;object-fit:cover}#overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;font-size:6rem;z-index:1000}#confetti{position:fixed;inset:0;pointer-events:none}.win{color:#ffe600;font-size:2rem;font-weight:bold}.lose{color:#ff5555;font-size:2rem;font-weight:bold}</style></head><body><div id="overlay">3</div><canvas id="confetti"></canvas><h1>💜 BTS × BLACKPINK Memory Match 🖤💗</h1><div class="topbar"><select id="difficulty"><option value="30">⭐⭐⭐⭐⭐ Hard (30s)</option><option value="45">⭐⭐⭐ Medium (45s)</option><option value="60">⭐ Easy (60s)</option></select><div class="info" id="timer">⏱️ 30</div><div class="info" id="counter">0 / 11 Matched</div><div class="info" id="highScore">🏆 Best Time: --</div><button onclick="restartGame()">Restart</button></div><div id="status">Match all pairs!</div><div id="game"></div><script>const idols=[['RM','BTS RM.jpg'],['Jin','BTS Jin.jpg'],['Suga','BTS Suga.jpg'],['J-Hope','BTS J-Hope.jpg'],['Jimin','BTS Jimin.jpg'],['V','BTS V.jpg'],['Jungkook','BTS Jungkook.jpg'],['Jisoo','BlackPink Jisoo.jpg'],['Jennie','BlackPink Jennie.jpg'],['Rose','BlackPink Rose.jpg'],['Lisa','BlackPink Lisa.jpg']].map(x=>({name:x[0],img:x[1]}));let cards=[],first=null,lock=false,matches=0,seconds=30,timer;let best=localStorage.getItem('bp_bts_best');if(best) setTimeout(()=>highScore.innerHTML='🏆 Best Time: '+best+' sec',50);function tone(f,t){try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;o.type='triangle';o.start();g.gain.setValueAtTime(.2,c.currentTime);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t);o.stop(c.currentTime+t);}catch(e){}}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}function celebrate(){for(let i=0;i<60;i++){let d=document.createElement('div');d.style.position='fixed';d.style.width='10px';d.style.height='10px';d.style.background=['pink','purple','gold','cyan'][Math.floor(Math.random()*4)];d.style.left=Math.random()*100+'vw';d.style.top='-20px';document.body.appendChild(d);d.animate([{transform:'translateY(0)'},{transform:'translateY(110vh)'}],{duration:3000});setTimeout(()=>d.remove(),3000)}}function build(){cards=[...idols,...idols];shuffle(cards);game.innerHTML='';cards.forEach((c,i)=>{let d=document.createElement('div');d.className='card';d.innerHTML='<div class="card-inner"><div class="front">💜🖤</div><div class="back"><img src="'+c.img+'"></div></div>';d.onclick=()=>flip(d,i);game.appendChild(d);});}function flip(el,i){if(lock||el.classList.contains('matched')||el===first?.el)return;el.classList.add('flipped');tone(650,.08);if(!first){first={el,i};return;}lock=true;if(cards[i].name===cards[first.i].name){el.classList.add('matched');first.el.classList.add('matched');matches++;counter.innerHTML=matches+' / 11 Matched';tone(900,.15);first=null;lock=false;if(matches===11){clearInterval(timer);celebrate();let used=Number(difficulty.value)-seconds;let b=localStorage.getItem('bp_bts_best');if(!b||used<Number(b)){localStorage.setItem('bp_bts_best',used);highScore.innerHTML='🏆 Best Time: '+used+' sec';}status.innerHTML='<div class="win">🎉 Congratulations Blink/Army!<br>🏆 You cleared all 11 pairs!</div>';}}else setTimeout(()=>{el.classList.remove('flipped');first.el.classList.remove('flipped');first=null;lock=false;},700);}function startTimer(){seconds=Number(difficulty.value);document.getElementById('timer').innerHTML='⏱️ '+seconds;clearInterval(timer);timer=setInterval(()=>{seconds--;document.getElementById('timer').innerHTML='⏱️ '+seconds;if(seconds<=0){clearInterval(timer);lock=true;status.innerHTML='<div class="lose">⏰ Time is Up!</div>';tone(200,.8)}},1000)}function countdown(){let n=3;overlay.style.display='flex';overlay.textContent='3';let c=setInterval(()=>{n--;if(n>0)overlay.textContent=n;else if(n===0)overlay.textContent='GO!';else{clearInterval(c);overlay.style.display='none';build();startTimer();}},1000)}function restartGame(){matches=0;counter.innerHTML='0 / 11 Matched';status.innerHTML='Match all pairs!';first=null;lock=false;countdown()}restartGame();</script></body></html>
