<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match the Idol</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Segoe UI,Arial,sans-serif;height:100vh;overflow:hidden;text-align:center;color:#fff;background:radial-gradient(circle at top,#ff69b4,#8a2be2,#111)}
h1{padding:6px;font-size:clamp(1.2rem,2vw,2rem)}
.topbar{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:4px}
.info,select,button{background:rgba(255,255,255,.15);color:#fff;border:none;padding:6px 12px;border-radius:20px}
#status{margin:4px}
#game{width:min(98vw,1800px);height:calc(100vh - 140px);margin:auto;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(4,1fr);gap:8px;padding:8px;justify-items:center;align-items:center}
.card{width:100%;height:100%;max-width:150px;max-height:150px;perspective:1000px;cursor:pointer}.card-inner{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}.card.flipped .card-inner,.card.matched .card-inner{transform:rotateY(180deg)}.front,.back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:12px;overflow:hidden}.front{display:flex;align-items:center;justify-content:center;font-size:2rem;background:linear-gradient(45deg,#ff1493,#8a2be2)}.back{transform:rotateY(180deg);background:#fff}.back img{width:100%;height:100%;object-fit:cover}.win{color:#ffe600}.lose{color:#ff5555}#overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;font-size:6rem;z-index:999}
@media(max-height:800px){.card{max-width:110px;max-height:110px}#game{height:calc(100vh - 120px)}}
</style>
</head><body>
<div id="overlay">3</div>
<h1>🖤💜 Match The Idol: BTS × BLACKPINK 💜🖤</h1>
<div class="topbar">
<select id="difficulty"><option value="30">Hard 30s</option><option value="45">Medium 45s</option><option value="60">Easy 60s</option></select>
<div class="info" id="timer">⏱️ 30</div>
<div class="info" id="counter">0 / 11 Matched</div>
<button onclick="restartGame()">Restart</button></div>
<div id="status">Match all pairs!</div><div id="game"></div>
<script>
const idols=[['RM','BTS RM.jpg'],['Jin','BTS Jin.jpg'],['Suga','BTS Suga.jpg'],['J-Hope','BTS J-Hope.jpg'],['Jimin','BTS Jimin.jpg'],['V','BTS V.jpg'],['Jungkook','BTS Jungkook.jpg'],['Jisoo','BlackPink Jisoo.jpg'],['Jennie','BlackPink Jennie.jpg'],['Rose','BlackPink Rose.jpg'],['Lisa','BlackPink Lisa.jpg']].map(x=>({name:x[0],img:x[1]}));
const game=document.getElementById('game'),counter=document.getElementById('counter'),statusEl=document.getElementById('status'),overlay=document.getElementById('overlay'),difficulty=document.getElementById('difficulty');
let cards=[],first=null,lock=false,matches=0,seconds=30,timer;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
function build(){cards=[...idols,...idols];shuffle(cards);game.innerHTML='';cards.forEach((c,i)=>{let d=document.createElement('div');d.className='card';d.innerHTML=`<div class="card-inner"><div class="front">💜🖤</div><div class="back"><img src="${c.img}"></div></div>`;d.onclick=()=>flip(d,i);game.appendChild(d);});}
function flip(el,i){if(lock||el.classList.contains('matched')||el===first?.el)return;el.classList.add('flipped');if(!first){first={el,i};return;}lock=true;if(cards[i].name===cards[first.i].name){el.classList.add('matched');first.el.classList.add('matched');matches++;counter.textContent=matches+' / 11 Matched';first=null;lock=false;if(matches===11){clearInterval(timer);statusEl.innerHTML='<div class="win">🎉 Congratulations Blink/Army!</div>';}}else{setTimeout(()=>{el.classList.remove('flipped');first.el.classList.remove('flipped');first=null;lock=false;},700)}}
function startTimer(){seconds=Number(difficulty.value);document.getElementById('timer').textContent='⏱️ '+seconds;clearInterval(timer);timer=setInterval(()=>{seconds--;document.getElementById('timer').textContent='⏱️ '+seconds;if(seconds<=0){clearInterval(timer);lock=true;statusEl.innerHTML='<div class="lose">⏰ Time is Up!</div>';}},1000)}
function countdown(){let n=3;overlay.style.display='flex';overlay.textContent='3';let c=setInterval(()=>{n--;if(n>0)overlay.textContent=n;else if(n===0)overlay.textContent='GO!';else{clearInterval(c);overlay.style.display='none';build();startTimer();}},1000)}
function restartGame(){matches=0;counter.textContent='0 / 11 Matched';statusEl.textContent='Match all pairs!';first=null;lock=false;countdown();}
restartGame();
</script></body></html>
